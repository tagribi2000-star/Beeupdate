name: Build BeeUpdate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        working-directory: .github
        run: mvn -B -DskipTests package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeeUpdate-JAR
          path: .github/target/*.jar
