economy:
  max-balance: 1000000000
  save-interval-seconds: 2

spawning:
  enabled: true
  worlds: [world]
  interval-ticks: 200        # كل 10 ثوانٍ
  chance-per-player: 0.40
  min-distance: 24
  max-distance: 48
  max-per-player: 3          # أقصى عدد قرب اللاعب الواحد
  nearby-radius: 64
  max-total: 40
  despawn-distance: 96
  world-spawn-protection-radius: 100
  protected-regions:         # إحداثيات X/Z لكل منطقة محمية
    # - {world: world, min-x: 500, min-z: 500, max-x: 700, max-z: 700}
  allowed-ground: [GRASS_BLOCK, DIRT, COARSE_DIRT, PODZOL, SAND, MOSS_BLOCK, SNOW_BLOCK]

afk:
  seconds: 120               # بدون تحريك الكاميرا أو دردشة أو أوامر
  block-radius: 64           # لا ظهور قرب لاعب AFK

rewards:
  min-damage-share: 0.0      # أي ضرر من اللاعب القاتل يكفي
  max-kills-per-minute: 15
  reward-command-spawned: true

models:
  enabled: true              # false = نحل فانيلا ظاهر بدون Resource Pack
  y-offset: -0.35
  yaw-offset: 0.0            # غيّرها إلى 180 إذا ظهر الموديل معكوسًا

anti-dupe:
  remove-duplicates: true

upgrades:
  max-level: 5
  base-price: 200            # سعر المستوى = base-price * tier * المستوى الجديد
  damage-per-level: 0.5
  efficiency-per-level: 2.0
  armor-per-level: 0.5
